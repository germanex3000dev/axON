[project]
name = "axon"
version = "0.1.0"
description = "A blood-red note-taking TUI app"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"